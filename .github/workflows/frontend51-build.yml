name: Frontend build

on:
  push:
    branches: [main]
    paths:
      - "abandoned-cart-recovery/**"
      - ".github/workflows/frontend51-build.yml"
  pull_request:
    paths:
      - "abandoned-cart-recovery/**"
      - ".github/workflows/frontend51-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abandoned-cart-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
